; Please visit documentation for the other options and examples
; https://docs.platformio.org/page/projectconf.html

[platformio]
default_envs = esp32

[env]
; Arduino v3.3.11 / IDF v5.5.5
platform = https://github.com/pioarduino/platform-espressif32/releases/download/55.03.311/platform-espressif32.zip

; Arduino v2.0.17 / IDF v4.4.7
#platform = espressif32@7.0.0

framework = arduino
monitor_speed = 115200

lib_deps =
    https://github.com/Blynk-Technologies/Edgent-Arduino/archive/refs/heads/main.zip
    blynkkk/Blynk@1.3.5
    bblanchon/ArduinoJson@7.4.3
    arduino-libraries/ArduinoHttpClient@0.6.1
    h2zero/NimBLE-Arduino@2.5.1
    mathertel/OneButton@2.6.2
    adafruit/Adafruit NeoPixel@1.15.5

lib_ignore =
    BLE  ; Ignore the built-in BLE library, use NimBLE instead

build_flags =
    -Werror=return-type     ; Fail on return type error
    -DCORE_DEBUG_LEVEL=0    ; Reduce build size
    -DBLYNK_USE_LITTLEFS
    -DARDUINO_LOOP_STACK_SIZE=8192
    -DCONFIG_NIMBLE_CPP_LOG_LEVEL=0
    -DCONFIG_BT_NIMBLE_ATT_PREFERRED_MTU=256
    -DCONFIG_BT_NIMBLE_ROLE_CENTRAL_DISABLED
    -DCONFIG_BT_NIMBLE_ROLE_OBSERVER_DISABLED

#build_type = debug
#monitor_filters = esp32_exception_decoder

board_build.filesystem = littlefs

; The board macro (ARDUINO_ESP32_DEV, ARDUINO_ESP32C3_DEV, ...) is defined by
; PlatformIO and selects a configuration in include/BoardConfig.h.
; If your board is not listed there, add it, or edit the "Custom board" section.

[env:esp32]
board = esp32dev
board_build.partitions = boards/partitions/partitions_4M.csv
upload_speed = 921600

[env:esp32c3]
board = esp32-c3-devkitm-1
board_build.partitions = boards/partitions/partitions_4M.csv
upload_speed = 460800

[env:esp32s2]
board = esp32-s2-saola-1
board_build.partitions = boards/partitions/partitions_4M.csv

lib_ignore =
    NimBLE-Arduino
    BLE

[env:esp32s3]
board = esp32-s3-devkitc-1
board_build.partitions = boards/partitions/partitions_8M.csv
upload_speed = 921600

[env:esp32c2]
board = esp32-c2-devkitm-1
board_build.partitions = boards/partitions/partitions_4M.csv
upload_speed = 460800
build_flags = ${env.build_flags}
    -DARDUINO_ESP32C2_DEV

lib_ignore =
    BLE
    Adafruit NeoPixel  ; NeoPixel issue https://github.com/adafruit/Adafruit_NeoPixel/issues/450

[env:esp32c5]
board = esp32-c5-devkitc-1
board_build.partitions = boards/partitions/partitions_4M.csv
upload_speed = 460800
build_flags = ${env.build_flags}
    -DARDUINO_ESP32C5_DEV

[env:esp32c6]
board = esp32-c6-devkitc-1
board_build.partitions = boards/partitions/partitions_8M.csv
upload_speed = 460800
build_flags = ${env.build_flags}
    -DARDUINO_ESP32C6_DEV
