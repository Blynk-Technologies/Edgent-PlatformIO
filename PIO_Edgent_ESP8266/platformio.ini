; Please visit documentation for the other options and examples
; https://docs.platformio.org/page/projectconf.html

[platformio]
default_envs = esp8266

[env]
platform = espressif8266@4.2.1
framework = arduino
monitor_speed = 115200

lib_deps =
    https://github.com/Blynk-Technologies/Edgent-Arduino/archive/refs/tags/v0.9.0.zip
    blynkkk/Blynk@1.3.5
    bblanchon/ArduinoJson@7.4.3
    arduino-libraries/ArduinoHttpClient@0.6.1
    https://github.com/vshymanskyy/Preferences/archive/refs/tags/v2.4.0.zip
    mathertel/OneButton@2.6.2
    adafruit/Adafruit NeoPixel@1.15.5

build_flags =
    -Werror=return-type     ; Fail on return type error
    -DPIO_FRAMEWORK_ARDUINO_LWIP2_HIGHER_BANDWIDTH
    -DBLYNK_USE_LITTLEFS

#build_type = debug

; The flash layout must provide at least 128 KB of filesystem space
board_build.ldscript = eagle.flash.4m1m.ld
board_build.filesystem = littlefs

; The board macro (ARDUINO_ESP8266_WEMOS_D1MINI, ARDUINO_ESP8266_NODEMCU_ESP12E, ...)
; is defined by PlatformIO and selects a configuration in include/BoardConfig.h.
; If your board is not listed there, add it, or edit the "Custom board" section.

[env:esp8266]
board = d1_mini
upload_speed = 460800
